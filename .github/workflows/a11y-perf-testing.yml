name: Nightly MySQL Cold-Start Proof (GAP-040)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'  # Nightly at 3 AM

env:
  PHP_VERSION: '8.2'
  COMPOSER_PROCESS_TIMEOUT: 0

# GAP-060: this nightly workflow now runs only the GAP-040 cold-start
# transaction-isolation proof (tests/E2E/TransactionIsolationColdStartTest.php),
# which runs nowhere else. The former accessibility (duplicate of the Feature
# suite), performance-budget / performance-heavy (selected zero tests) and
# lighthouse-ci (audited the login page, no budgets) jobs were removed, as was
# the tests/E2E suite step: CriticalUserFlowsE2ETest and DashboardE2ETest never
# worked and are tracked separately as GAP-061.
# See docs/owner-decisions/GAP-060/02-design-v2.md.

jobs:
  gap040-cold-start-proof:
    name: GAP-040 Cold-Start Proof (MySQL)
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      ZENA_INVARIANTS_DB: mysql
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: zenamanage_test
      DB_USERNAME: test_user
      DB_PASSWORD: test_password

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: zenamanage_test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ env.PHP_VERSION }}
        extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, redis, gd, zip, bcmath, opcache
        ini-values: |
          pcov.enabled=1
          pcov.directory=app
          pcov.exclude="~vendor~"

    - name: Cache Composer dependencies
      uses: actions/cache@v5
      with:
        path: vendor
        key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-

    - name: Install Composer dependencies
      run: composer install --no-progress --prefer-dist --optimize-autoloader

    - name: Setup environment
      run: |
        cp .env.example .env
        php artisan key:generate
        php artisan config:cache
        php artisan route:cache
        php artisan view:cache

    - name: Run database migrations
      run: php artisan migrate --force

    - name: Verify MySQL is genuinely reachable (GAP-039)
      run: |
        source scripts/ci/lib/mysql-fail-closed.sh
        zena_mysql_ensure_connection
        zena_mysql_preflight_connection

    - name: Run GAP-040 cold-start transaction-isolation proof (isolated — see docs/audits/2026-08-20-gap-040-testcase-mysql-transaction-isolation-evidence.md)
      run: php artisan test tests/E2E/TransactionIsolationColdStartTest.php --fail-on-empty-test-suite
