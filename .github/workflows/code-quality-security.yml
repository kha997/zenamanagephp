          echo "## License Check"
          echo '```text'
          sed -n '1,40p' composer-license-check.txt || true
          sed -n '1,40p' composer-license-check.stderr.log || true
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload License Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: license-report
        path: |
          composer-license-check.txt
          composer-license-check.stdout.log
          composer-license-check.stderr.log

    - name: Comment License Issues on PR
      if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      continue-on-error: true
      uses: actions/github-script@v8
      with:
        script: |
          // GAP-075: one marked comment per report; posted only on problems, deleted when clean.
          async function syncReport(key, body) {
            const marker = `<!-- zena-ci:${key} -->`;
            const params = { owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number };
            const comments = await github.paginate(github.rest.issues.listComments, { ...params, per_page: 100 });
            const existing = comments.find(c => c.user?.type === 'Bot' && (c.body || '').startsWith(marker));
            if (!body) {
              if (existing) {
                await github.rest.issues.deleteComment({ owner: params.owner, repo: params.repo, comment_id: existing.id });
              }
              return;
            }
            const full = `${marker}\n${body}`;
            if (!existing) {
              await github.rest.issues.createComment({ ...params, body: full });
            } else if (existing.body !== full) {
              await github.rest.issues.updateComment({ owner: params.owner, repo: params.repo, comment_id: existing.id, body: full });
            }
          }
          const fs = require('fs');
          const summary = fs.existsSync('composer-license-check.txt')
            ? fs.readFileSync('composer-license-check.txt', 'utf8').trim()
            : '';

          let body = '';
          if (summary.length > 0) {
            body += '```text\n' + summary.split('\n').slice(0, 20).join('\n') + '\n```';
          }

          await syncReport('license', body ? `## License Compliance Report\n\n${body}` : '');
