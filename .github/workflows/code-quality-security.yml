name: Code Quality & Security

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  push:
    branches: [ main, develop, feature/* ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  schedule:
    - cron: '0 3 * * *'  # Daily at 3 AM

env:
  PHP_VERSION: '8.2'
  REPORT_SUMMARY_LIMIT: '20'

# GAP-075: one run per PR at a time, so report comments reflect the latest head.
concurrency:
  group: code-quality-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write
  issues: write
  security-events: write

jobs:
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ env.PHP_VERSION }}
        extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, redis, gd, zip, bcmath, opcache

    - name: Cache Composer dependencies
      uses: actions/cache@v5
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install Composer dependencies
      run: composer install --prefer-dist --no-progress --no-suggest

    - name: Run PHPStan Static Analysis
      run: |
        bash scripts/ci/run-json-report-command.sh phpstan-report.json phpstan ./vendor/bin/phpstan analyse --error-format=json

    - name: Summarize PHPStan Static Analysis
      if: always()
      run: |
        {
          echo "## PHPStan"
          echo '```text'
          php scripts/ci/print-phpstan-summary.php phpstan-report.json "${REPORT_SUMMARY_LIMIT}" || true
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Run PHP CS Fixer
      continue-on-error: true
      run: |
        composer require --dev friendsofphp/php-cs-fixer
        bash scripts/ci/run-json-report-command.sh cs-fixer-report.json php-cs-fixer ./vendor/bin/php-cs-fixer fix --dry-run --diff --format=json

    - name: Run PHP Mess Detector
      continue-on-error: true
      run: |
        composer require --dev phpmd/phpmd
        ./vendor/bin/phpmd app text cleancode,codesize,controversial,design,naming,unusedcode > phpmd-report.txt

    - name: Run PHP Copy Paste Detector
      continue-on-error: true
      run: |
        composer require --dev sebastian/phpcpd
        ./vendor/bin/phpcpd app --min-lines=5 --min-tokens=70 > phpcpd-report.txt

    - name: Upload Code Quality Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: code-quality-reports
        path: |
          phpstan-report.json
          phpstan-report.stderr.log
          cs-fixer-report.json
          phpmd-report.txt
          phpcpd-report.txt

    - name: Comment Code Quality on PR
      if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      continue-on-error: true
      uses: actions/github-script@v8
      with:
        script: |
          // GAP-075: one marked comment per report; posted only on problems, deleted when clean.
          async function syncReport(key, body) {
            const marker = `<!-- zena-ci:${key} -->`;
            const params = { owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number };
            const comments = await github.paginate(github.rest.issues.listComments, { ...params, per_page: 100 });
            const existing = comments.find(c => c.user?.type === 'Bot' && (c.body || '').startsWith(marker));
            if (!body) {
              if (existing) {
                await github.rest.issues.deleteComment({ owner: params.owner, repo: params.repo, comment_id: existing.id });
              }
              return;
            }
            const full = `${marker}\n${body}`;
            if (!existing) {
              await github.rest.issues.createComment({ ...params, body: full });
            } else if (existing.body !== full) {
              await github.rest.issues.updateComment({ owner: params.owner, repo: params.repo, comment_id: existing.id, body: full });
            }
          }
          const fs = require('fs');
          const phpstan = JSON.parse(fs.readFileSync('phpstan-report.json', 'utf8'));
          const csFixer = JSON.parse(fs.readFileSync('cs-fixer-report.json', 'utf8'));
          const changed = new Set((await github.paginate(github.rest.pulls.listFiles, {
            owner: context.repo.owner, repo: context.repo.repo, pull_number: context.issue.number, per_page: 100,
          })).map(f => f.filename));

          let body = '';
          const phpstanErrors = (phpstan.totals?.errors ?? 0) + (phpstan.totals?.file_errors ?? 0);
          if (phpstanErrors > 0) {
            body += `### PHPStan Issues: ${phpstanErrors} errors\n`;
          } else if (phpstan.status === 'failed') {
            body += `### PHPStan did not complete (exit code ${phpstan.exit_code})\n`;
          }
          if (csFixer.status === 'failed') {
            body += `\n### php-cs-fixer did not complete (exit code ${csFixer.exit_code})\n`;
          }
          const styleFiles = (csFixer.files || []).map(f => f.name).filter(name => changed.has(name));
          if (styleFiles.length > 0) {
            body += `\n### Code Style Issues in files changed by this PR: ${styleFiles.length}\n`;
            styleFiles.slice(0, 20).forEach(name => { body += `- ${name}\n`; });
          }

          await syncReport('code-quality', body ? `## Code Quality Report\n\n${body}` : '');
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ env.PHP_VERSION }}
        extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, redis, gd, zip, bcmath, opcache

    - name: Cache Composer dependencies
      uses: actions/cache@v5
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install Composer dependencies
      run: composer install --prefer-dist --no-progress --no-suggest

    - name: Run Composer Security Audit
      run: composer audit --format=json > composer-audit.json || true

    - name: Run PHP Security Checker
      continue-on-error: true
      run: |
        composer require --dev enlightn/security-checker
        bash scripts/ci/run-json-report-command.sh security-checker.json security-checker ./vendor/bin/security-checker security:check --format=json

    - name: Run PHPStan Security Rules
      continue-on-error: true
      run: |
        composer require --dev phpstan/phpstan-security-rules
        bash scripts/ci/run-json-report-command.sh phpstan-security.json phpstan-security ./vendor/bin/phpstan analyse --level=8 --error-format=json

    - name: Summarize Security Scans
      if: always()
      run: |
        {
          echo "## Security Checker"
          echo '```text'
          php scripts/ci/print-json-report-summary.php security-checker.json "security-checker" "${REPORT_SUMMARY_LIMIT}" || true
          echo '```'
          echo
          echo "## PHPStan Security"
          echo '```text'
          php scripts/ci/print-phpstan-summary.php phpstan-security.json "${REPORT_SUMMARY_LIMIT}" || true
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Run PHP CS Fixer Security Rules
      continue-on-error: true
      run: |
        composer require --dev friendsofphp/php-cs-fixer
        bash scripts/ci/run-json-report-command.sh cs-fixer-security.json php-cs-fixer-security ./vendor/bin/php-cs-fixer fix --dry-run --diff --format=json

    - name: Upload Security Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          composer-audit.json
          security-checker.json
          security-checker.stderr.log
          phpstan-security.json
          phpstan-security.stderr.log
          cs-fixer-security.json

    - name: Comment Security Issues on PR
      if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      continue-on-error: true
      uses: actions/github-script@v8
      with:
        script: |
          // GAP-075: one marked comment per report; posted only on problems, deleted when clean.
          async function syncReport(key, body) {
            const marker = `<!-- zena-ci:${key} -->`;
            const params = { owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number };
            const comments = await github.paginate(github.rest.issues.listComments, { ...params, per_page: 100 });
            const existing = comments.find(c => c.user?.type === 'Bot' && (c.body || '').startsWith(marker));
            if (!body) {
              if (existing) {
                await github.rest.issues.deleteComment({ owner: params.owner, repo: params.repo, comment_id: existing.id });
              }
              return;
            }
            const full = `${marker}\n${body}`;
            if (!existing) {
              await github.rest.issues.createComment({ ...params, body: full });
            } else if (existing.body !== full) {
              await github.rest.issues.updateComment({ owner: params.owner, repo: params.repo, comment_id: existing.id, body: full });
            }
          }
          const fs = require('fs');
          const composerAudit = JSON.parse(fs.readFileSync('composer-audit.json', 'utf8'));
          const securityChecker = JSON.parse(fs.readFileSync('security-checker.json', 'utf8'));

          let body = '';
          const advisories = composerAudit.advisories
            ? Array.isArray(composerAudit.advisories)
              ? composerAudit.advisories
              : Object.values(composerAudit.advisories).flat()
            : [];

          if (advisories.length > 0) {
            body += `### Composer Security Issues: ${advisories.length} vulnerabilities found\n`;
            advisories.slice(0, 5).forEach(advisory => {
              body += `- ${advisory.packageName}: ${advisory.title}\n`;
            });
          }

          if (securityChecker.vulnerabilities && securityChecker.vulnerabilities.length > 0) {
            body += `\n### Security Checker Issues: ${securityChecker.vulnerabilities.length} vulnerabilities found\n`;
            securityChecker.vulnerabilities.slice(0, 5).forEach(vuln => {
              body += `- ${vuln.package}: ${vuln.title}\n`;
            });
          }

          await syncReport('security', body ? `## Security Scan Report\n\n${body}` : '');
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ env.PHP_VERSION }}
        extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, redis, gd, zip, bcmath, opcache

    - name: Cache Composer dependencies
      uses: actions/cache@v5
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install Composer dependencies
      run: composer install --prefer-dist --no-progress --no-suggest

    - name: Run Composer Outdated Check
      continue-on-error: true
      run: |
        bash scripts/ci/run-json-report-command.sh composer-outdated.json composer-outdated composer outdated --format=json

    - name: Compare outdated packages with the base branch
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      continue-on-error: true
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        composer outdated --locked --no-plugins --format=json > outdated-locked-head.json || true
        git fetch --no-tags --depth=1 origin "$BASE_SHA"
        mkdir -p "$RUNNER_TEMP/base-composer"
        git show "$BASE_SHA:composer.json" > "$RUNNER_TEMP/base-composer/composer.json"
        git show "$BASE_SHA:composer.lock" > "$RUNNER_TEMP/base-composer/composer.lock"
        composer outdated --locked --no-plugins --format=json --working-dir="$RUNNER_TEMP/base-composer" > outdated-locked-base.json || true

    - name: Run Composer Require Checker
      continue-on-error: true
      run: |
        composer require --dev maglnet/composer-require-checker
        set +e
        ./vendor/bin/composer-require-checker check --output composer-require-checker.txt > composer-require-checker.stdout.log 2> composer-require-checker.stderr.log
        status=$?
        set -e
        if [[ ! -f composer-require-checker.txt ]]; then
          touch composer-require-checker.txt
        fi
        exit $status

    - name: Summarize Dependency Reports
      if: always()
      run: |
        {
          echo "## Composer Outdated"
          echo '```text'
          php scripts/ci/print-json-report-summary.php composer-outdated.json "composer-outdated" 10 || true
          echo '```'
          echo
          echo "## Composer Require Checker"
          echo '```text'
          sed -n '1,40p' composer-require-checker.txt || true
          sed -n '1,40p' composer-require-checker.stderr.log || true
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload Dependency Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dependency-reports
        path: |
          composer-outdated.json
          composer-require-checker.txt
          composer-require-checker.stdout.log
          composer-require-checker.stderr.log

    - name: Comment Dependency Issues on PR
      if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      continue-on-error: true
      uses: actions/github-script@v8
      with:
        script: |
          // GAP-075: one marked comment per report; posted only on problems, deleted when clean.
          async function syncReport(key, body) {
            const marker = `<!-- zena-ci:${key} -->`;
            const params = { owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number };
            const comments = await github.paginate(github.rest.issues.listComments, { ...params, per_page: 100 });
            const existing = comments.find(c => c.user?.type === 'Bot' && (c.body || '').startsWith(marker));
            if (!body) {
              if (existing) {
                await github.rest.issues.deleteComment({ owner: params.owner, repo: params.repo, comment_id: existing.id });
              }
              return;
            }
            const full = `${marker}\n${body}`;
            if (!existing) {
              await github.rest.issues.createComment({ ...params, body: full });
            } else if (existing.body !== full) {
              await github.rest.issues.updateComment({ owner: params.owner, repo: params.repo, comment_id: existing.id, body: full });
            }
          }
          const fs = require('fs');
          const read = file => {
            try { return JSON.parse(fs.readFileSync(file, 'utf8')).locked || []; } catch (e) { return null; }
          };
          const head = read('outdated-locked-head.json');
          const base = read('outdated-locked-base.json');

          let body = '';
          if (head !== null && base !== null && head.length > base.length) {
            const baseNames = new Set(base.map(pkg => pkg.name));
            const added = head.filter(pkg => !baseNames.has(pkg.name));
            body += `### Outdated packages: ${head.length} (main: ${base.length})\n`;
            added.slice(0, 20).forEach(pkg => {
              body += `- ${pkg.name}: ${pkg.version} → ${pkg.latest}\n`;
            });
          }

          await syncReport('dependency', body ? `## Dependency Scan Report\n\n${body}` : '');
  docker-security:
    name: Docker Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.prod
        push: false
        tags: zenamanage:test
        load: true
        cache-from: type=gha
        cache-to: type=gha,mode=max
        # Rebuild the OS-package layers every run so fixed Alpine packages are scanned (GAP-071)
        no-cache-filters: production
    - name: Verify image present
      run: docker image inspect zenamanage:test

    - name: Smoke test image (PHP extensions, php-fpm config)
      run: |
        modules="$(docker run --rm zenamanage:test php -m)"
        missing=0
        for ext in pdo_mysql mbstring xml zip intl gd 'Zend OPcache' bcmath sockets redis; do
          if ! printf '%s\n' "$modules" | grep -qixF "$ext"; then
            echo "::error::PHP extension missing from image: $ext"
            missing=1
          fi
        done
        [ "$missing" -eq 0 ]
        docker run --rm zenamanage:test php-fpm -t
        docker run --rm zenamanage:test nginx -t

    - name: Smoke test image (container serves HTTP)
      run: |
        app_key="base64:$(openssl rand -base64 32)"
        docker run -d --name zenamanage-smoke -p 8080:80 \
          -e APP_KEY="$app_key" -e APP_ENV=production -e APP_DEBUG=false \
          -e DB_CONNECTION=sqlite -e DB_DATABASE=/tmp/smoke.sqlite \
          -e CACHE_STORE=file -e SESSION_DRIVER=file -e QUEUE_CONNECTION=sync \
          zenamanage:test
        ok=0
        for i in $(seq 1 30); do
          if curl -fsS --max-time 5 -o /dev/null http://127.0.0.1:8080/api/health; then ok=1; break; fi
          sleep 2
        done
        status=0
        if [ "$ok" -ne 1 ]; then
          echo "::error::/api/health did not return 200 within 60s"
          status=1
        fi
        curl -fsS --max-time 5 -o /dev/null http://127.0.0.1:8080/robots.txt || { echo "::error::/robots.txt did not return 200"; status=1; }
        if [ "$status" -ne 0 ]; then
          docker logs zenamanage-smoke || true
          docker exec zenamanage-smoke sh -c 'tail -n 50 /var/log/supervisor/*.log' || true
        fi
        docker rm -f zenamanage-smoke >/dev/null
        exit "$status"

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@0.35.0
      with:
        image-ref: 'zenamanage:test'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Run Trivy vulnerability scanner (JSON)
      uses: aquasecurity/trivy-action@0.35.0
      with:
        image-ref: 'zenamanage:test'
        format: 'json'
        output: 'trivy-results.json'

    - name: Upload Trivy JSON results
      uses: actions/upload-artifact@v4
      with:
        name: trivy-results
        path: trivy-results.json

    - name: Comment Docker Security Issues on PR
      if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      continue-on-error: true
      uses: actions/github-script@v8
      with:
        script: |
          // GAP-075: one marked comment per report; posted only on problems, deleted when clean.
          async function syncReport(key, body) {
            const marker = `<!-- zena-ci:${key} -->`;
            const params = { owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number };
            const comments = await github.paginate(github.rest.issues.listComments, { ...params, per_page: 100 });
            const existing = comments.find(c => c.user?.type === 'Bot' && (c.body || '').startsWith(marker));
            if (!body) {
              if (existing) {
                await github.rest.issues.deleteComment({ owner: params.owner, repo: params.repo, comment_id: existing.id });
              }
              return;
            }
            const full = `${marker}\n${body}`;
            if (!existing) {
              await github.rest.issues.createComment({ ...params, body: full });
            } else if (existing.body !== full) {
              await github.rest.issues.updateComment({ owner: params.owner, repo: params.repo, comment_id: existing.id, body: full });
            }
          }
          const fs = require('fs');
          const trivyResults = JSON.parse(fs.readFileSync('trivy-results.json', 'utf8'));

          let body = '';
          const withVulns = (trivyResults.Results || []).filter(r => r.Vulnerabilities && r.Vulnerabilities.length > 0);
          const totalVulns = withVulns.reduce((n, r) => n + r.Vulnerabilities.length, 0);
          if (totalVulns > 0) {
            body += `### Vulnerabilities Found: ${totalVulns} total\n`;
            withVulns.forEach(result => {
              body += `\n#### ${result.Target}\n`;
              result.Vulnerabilities.slice(0, 5).forEach(vuln => {
                body += `- ${vuln.VulnerabilityID}: ${vuln.Title} (${vuln.Severity})\n`;
              });
            });
          }

          await syncReport('docker', body ? `## Docker Security Scan Report\n\n${body}` : '');
  license-scan:
    name: License Compliance Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup PHP
