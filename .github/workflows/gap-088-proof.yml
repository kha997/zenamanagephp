name: GAP-088 temporary proof

on:
  pull_request:

permissions:
  contents: read

jobs:
  build-other-dockerfiles:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile: [Dockerfile.websocket, Dockerfile]
    steps:
      - uses: actions/checkout@v5
      - name: Work around the missing docker/php/php-fpm.conf (pre-existing, CI workspace only)
        if: matrix.dockerfile == 'Dockerfile'
        run: cp docker/php-fpm.conf docker/php/php-fpm.conf
      - name: Work around missing build packages in Dockerfile.websocket (pre-existing, CI workspace only)
        if: matrix.dockerfile == 'Dockerfile.websocket'
        run: |
          sed -i 's/^    mysql-client \\$/    mysql-client linux-headers $PHPIZE_DEPS \\/' Dockerfile.websocket
          grep -n 'linux-headers' Dockerfile.websocket
      - name: Build ${{ matrix.dockerfile }}
        run: docker build -f "${{ matrix.dockerfile }}" -t gap088-proof .
      - name: redis extension is loaded
        run: docker run --rm --entrypoint php gap088-proof -m | tee modules.txt && grep -qx redis modules.txt
