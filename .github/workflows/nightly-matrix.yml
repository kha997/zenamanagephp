name: Nightly Test Matrix

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

env:
  PHP_VERSION: '8.2'
  APP_ENV: testing
  DB_CONNECTION: sqlite
  DB_DATABASE: /tmp/zenamanage_test.sqlite
  # GAP-093: in-memory cache and sync queue by default, as the PR test jobs
  # use; a shared Redis cache made rate limits leak across tests. The redis
  # group switches to CACHE_DRIVER=redis itself (scripts/test/nightly_matrix.sh).
  CACHE_DRIVER: array
  QUEUE_CONNECTION: sync
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: 6379
  RUN_SLOW_TESTS: '1'
  RUN_LOAD_TESTS: '1'
  RUN_STRESS_TESTS: '1'
  RUN_REDIS_TESTS: '1'
  COMPOSER_PROCESS_TIMEOUT: 0

jobs:
  nightly:
    name: Nightly Matrix (slow/load/stress/redis)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, redis, gd, zip, bcmath, opcache
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Prepare application env
        run: |
          # GAP-093: .env.testing is not in the repository; the job env above
          # supplies the testing values.
          cp .env.example .env
          php artisan key:generate --force
          touch "${DB_DATABASE}"
          php artisan migrate:fresh --force

      # GAP-093: no app server or websocket server is started; no test in the
      # nightly groups calls the app over HTTP.
      - name: Wait for Redis
        run: |
          php -r '
            $errno = 0;
            $errstr = "";
            $fp = @fsockopen(getenv("REDIS_HOST"), (int) getenv("REDIS_PORT"), $errno, $errstr, 2);
            if ($fp === false) {
              fwrite(STDERR, "Redis is not reachable: " . $errstr . PHP_EOL);
              exit(1);
            }
            fclose($fp);
            echo "Redis reachable" . PHP_EOL;
          '

      - name: Run nightly matrix
        run: composer test:nightly

      - name: Upload nightly report artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-matrix-report
          path: |
            storage/app/nightly/nightly-report.md
            storage/app/nightly/*.xml
            storage/app/nightly/*.log
            storage/app/nightly/summary.tsv
          if-no-files-found: warn
