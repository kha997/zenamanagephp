name: Owner Governance Lint

on:
  pull_request:
    paths:
      - 'docs/owner-decisions/**'
      - 'docs/owner-governance/**'
      - 'docs/superpowers/plans/**'
      - 'docs/superpowers/specs/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/workflows/**'
      - 'PROJECT_CONSTITUTION.md'
  push:
    branches: [ "main" ]
    paths:
      - 'docs/owner-decisions/**'
      - 'docs/owner-governance/**'
      - 'docs/superpowers/plans/**'
      - 'docs/superpowers/specs/**'
      - '.github/workflows/**'

jobs:
  owner-governance-lint:
    name: Owner Governance Lint
    runs-on: ubuntu-latest
    env:
      COMPOSER_PROCESS_TIMEOUT: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # On a pull_request trigger, actions/checkout defaults to the
          # synthetic refs/pull/<n>/merge commit, not the real PR head SHA.
          # owner_governance_compute_implementation_tree_digest() runs
          # `git ls-tree -r <sha>` against the REAL PR head
          # (github.event.pull_request.head.sha, passed as PR_HEAD_SHA
          # below) — that commit object was never fetched under the
          # default merge-ref checkout, so `git ls-tree` silently failed
          # (stderr suppressed) and returned empty output, which hashed to
          # sha256("") and was misreported as a genuine digest mismatch.
          # Caught on this workflow's own real CI run on PR #239. Checking
          # out the real head ref directly ensures that exact commit's
          # tree/blobs are actually present.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Structural validation (schema + enums + contradictions)
        run: php scripts/ssot/owner_governance_lint.php

      - name: MySQL claim truthfulness (GAP-039 regression guard)
        run: php scripts/ci/lint-mysql-claim-truthfulness.php

      - name: Gate-ordering enforcement (effective-date boundary)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # OWN-2026-005: on a pull_request event, pass this submission's
          # COMPLETE, verified changed-file list (scripts/ci/fetch-pr-changed-files.sh
          # — paginated REST fetch, cross-checked against the PR's
          # authoritative changedFiles count, fails closed on any error or
          # mismatch) as a lossless JSON file, so the design-only exemption
          # (a design spec referencing its OWN work_id's still-awaiting_owner
          # Gate 2 packet) can be recognized without risking an incomplete
          # or corrupted file list. On a push event (no PR number available),
          # no flag is passed and behavior is byte-for-byte identical to
          # before this correction — no exemption without positive,
          # explicit, verified-complete evidence of what changed.
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            changed_files_json="${RUNNER_TEMP}/own-2026-005-changed-files.json"
            bash scripts/ci/fetch-pr-changed-files.sh > "$changed_files_json"
            php scripts/ssot/owner_governance_lint.php --enforce-gate-ordering "--changed-files-json=${changed_files_json}"
          else
            php scripts/ssot/owner_governance_lint.php --enforce-gate-ordering
          fi

      - name: Gate-3-before-ready check (only on PRs, needs gh + PR number)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/ci/check-gate3-before-ready.sh

      - name: Evidence-freshness check (Correction 2 — only on PRs, needs gh + PR number + work_id)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          body="$(gh pr view "$PR_NUMBER" --json body --jq '.body')"
          if ! work_id="$(printf '%s' "$body" | bash scripts/ci/extract-work-id.sh)"; then
            echo "::error::No authoritative 'Work ID: <candidate>' declaration on the first non-empty line of the PR body — see the extract-work-id diagnostic above. Evidence-freshness cannot resolve which Gate 3 packet to check."
            exit 1
          fi
          WORK_ID="$work_id" bash scripts/ci/check-evidence-freshness.sh
