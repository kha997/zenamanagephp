name: Release Management

on:
  push:
    tags:
      - 'v*'
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        required: true
        type: string
      release_type:
        description: 'Type of release'
        required: true
        default: 'minor'
        type: choice
        options:
        - major
        - minor
        - patch
        - prerelease

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  SLACK_WEBHOOK_RELEASES: ${{ secrets.SLACK_WEBHOOK_RELEASES }}

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Generate version number
      id: version
      run: |
        if [ "${{ github.event.inputs.release_type }}" = "major" ]; then
          VERSION=$(echo "${{ github.event.inputs.version }}" | sed 's/^v//' | awk -F. '{print $1+1".0.0"}')
        elif [ "${{ github.event.inputs.release_type }}" = "minor" ]; then
          VERSION=$(echo "${{ github.event.inputs.version }}" | sed 's/^v//' | awk -F. '{print $1"."$2+1".0"}')
        elif [ "${{ github.event.inputs.release_type }}" = "patch" ]; then
          VERSION=$(echo "${{ github.event.inputs.version }}" | sed 's/^v//' | awk -F. '{print $1"."$2"."$3+1}')
        else
          VERSION="${{ github.event.inputs.version }}"
        fi
        echo "version=v$VERSION" >> $GITHUB_OUTPUT
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    - name: Create release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        prerelease_args=()
        if [ "${{ github.event.inputs.release_type }}" = "prerelease" ]; then
          prerelease_args+=(--prerelease)
        fi

        cat > release-notes.md <<'EOF'
        ## Release ${{ steps.version.outputs.version }}

        ### Changes
        - Automated release generated by CI/CD pipeline
        - Docker images built and pushed to registry
        - Production deployment ready

        ### Docker Images
        - `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}`

        ### Deployment
        This release is ready for production deployment.
        EOF

        gh release create "${{ steps.version.outputs.version }}" \
          --title "Release ${{ steps.version.outputs.version }}" \
          --notes-file release-notes.md \
          "${prerelease_args[@]}"

  build-release:
    name: Build Release Images
    runs-on: ubuntu-latest
    needs: create-release
    if: always() && (needs.create-release.result == 'success' || github.event_name == 'release')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Container Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push main application image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile.prod
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  generate-changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    needs: create-release
    if: always() && (needs.create-release.result == 'success' || github.event_name == 'release')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Generate changelog
      id: changelog
      run: |
        # Get the previous tag
        PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
        
        # Generate changelog
        if [ -n "$PREVIOUS_TAG" ]; then
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" $PREVIOUS_TAG..HEAD)
        else
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" --max-count=20)
        fi
        
        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGELOG" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Update release with changelog
      uses: actions/github-script@v8
      with:
        script: |
          const { data: release } = await github.rest.repos.getReleaseByTag({
            owner: context.repo.owner,
            repo: context.repo.repo,
            tag: context.ref.replace('refs/tags/', '')
          });
          
          const changelog = `${{ steps.changelog.outputs.changelog }}`;
          
          await github.rest.repos.updateRelease({
            owner: context.repo.owner,
            repo: context.repo.repo,
            release_id: release.id,
            body: release.body + `\n\n### Changelog\n${changelog}`
          });

  security-scan-release:
    name: Security Scan Release
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    needs: build-release
    if: always() && needs.build-release.result == 'success'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build Docker image for scanning
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile.prod
        push: false
        tags: zenamanage:release-scan
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: 'zenamanage:release-scan'
        format: 'sarif'
        output: 'trivy-release-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: 'trivy-release-results.sarif'

    - name: Run Trivy vulnerability scanner (JSON)
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: 'zenamanage:release-scan'
        format: 'json'
        output: 'trivy-release-results.json'

    - name: Upload Trivy JSON results
      uses: actions/upload-artifact@v7
      with:
        name: trivy-release-results
        path: trivy-release-results.json

  # GAP-115 W-1: the retired production jobs (deploy-release, rollback-release, cleanup-release — already `if: false`
  # since GAP-049) were removed. Production is deployed only by .github/workflows/production.yml (manual, exact SHA,
  # deploy:migrate safety); rollback uses scripts/deploy/rollback.sh. See docs/runbooks/go-live.md.
