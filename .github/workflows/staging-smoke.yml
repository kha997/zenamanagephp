name: Staging Smoke

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  push:
    branches:
      - main
      - staging
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

jobs:
  staging-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      XDEBUG_MODE: off
      PCOV_ENABLED: 0
      APP_HOST: 127.0.0.1
      APP_PORT: 18080
      SMOKE_ENV_NAME: smoke
      SMOKE_ENV_FILE: .env.smoke
      SMOKE_DB_PATH: /tmp/zenamanage_smoke.sqlite
      SMOKE_REPORT_FILE: ${{ github.workspace }}/smoke-report.md
      # GAP-092: php-fpm behind nginx instead of `php artisan serve`, whose
      # single-process server died mid-request in about 1 run in 4.
      SMOKE_SERVER: fpm

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, curl, sqlite3, pdo_sqlite
          coverage: none
          ini-values: opcache.enable_cli=0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: Install nginx
        run: |
          if ! command -v nginx >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq nginx
          fi

      - name: Run staging smoke
        run: bash scripts/smoke_staging.sh

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-report
          path: ${{ github.workspace }}/smoke-report.md
          if-no-files-found: warn

      - name: Upload smoke server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-server-log
          path: /tmp/smoke_server.log
          if-no-files-found: warn

      - name: Upload smoke nginx logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-nginx-logs
          path: |
            /tmp/smoke-nginx-error.log
            /tmp/smoke-nginx-access.log
          if-no-files-found: warn

      - name: Upload laravel smoke log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-laravel-log
          path: storage/logs/laravel.log
          if-no-files-found: warn
