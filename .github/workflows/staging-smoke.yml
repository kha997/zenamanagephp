name: Staging Smoke

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  push:
    branches:
      - main
      - staging
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

jobs:
  staging-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      XDEBUG_MODE: off
      PCOV_ENABLED: 0
      APP_HOST: 127.0.0.1
      APP_PORT: 18080
      SMOKE_ENV_NAME: smoke
      SMOKE_ENV_FILE: .env.smoke
      SMOKE_DB_PATH: /tmp/zenamanage_smoke.sqlite
      SMOKE_REPORT_FILE: ${{ github.workspace }}/smoke-report.md

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, curl, sqlite3, pdo_sqlite
          coverage: none
          ini-values: opcache.enable_cli=0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: Run staging smoke
        # Retries guard against a verified GitHub-side runner-image regression,
        # not an app bug: every historical SIGSEGV of `php artisan serve` on
        # this job traced to ubuntu24/20260714.240.1 (kernel 6.17.0-1020-azure);
        # 17/17 reruns on the prior image (20260705.232.1, kernel ...1018-azure)
        # were clean. Root-cause writeup: PR #152 discussion, 2026-07-16.
        # Remove this retry once GitHub's runner pool is confirmed stable again.
        run: |
          for attempt in 1 2 3; do
            if bash scripts/smoke_staging.sh; then
              exit 0
            fi
            echo "::warning::staging smoke attempt ${attempt} failed, retrying if attempts remain"
            sleep 5
          done
          exit 1

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: ${{ github.workspace }}/smoke-report.md
          if-no-files-found: warn

      - name: Upload smoke server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-server-log
          path: /tmp/smoke_server.log
          if-no-files-found: warn

      - name: Upload laravel smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-laravel-log
          path: storage/logs/laravel.log
          if-no-files-found: warn
