version: 1
project: ZenaManage
repo: zenamanage-golden
purpose: >
  Single Source of Truth (SSOT) backlog for AEC + Interior + Inspection platform.
  Codex must reference this file and implement Stories in order of priority, without violating invariants.
canonical_execution_roadmap: docs/roadmap/canonical-roadmap.md

governance:
  invariants:
    - "Do not change domain/business logic just to pass tests."
    - "Tenant isolation + RBAC + middleware gate are immutable: routes must be in correct stack."
    - "SSOT lint must pass: composer ssot:lint must not introduce NEW violations beyond baseline."
    - "No disabling/removing tests to pass CI."
    - "Deploy workflows must not run on PR; deploy only on push main / workflow_dispatch."
  definition_of_done:
    - "composer ssot:lint passes (no NEW violations)."
    - "Routes/middleware policy respected (auth + tenant + rbac + envelope as applicable)."
    - "Evidence-gated: include repro/verify commands and CI links in PR description."
    - "No secrets required on PR jobs; gate/skip gracefully where needed."
  workflow_rules_for_codex:
    - "Work on ONE Story per PR unless explicitly grouped by maintainer."
    - "Update this YAML: set story.status to done and add story.done_evidence (PR link + checks)."
    - "If a Story requires policy change, mark as change_proposal with rationale and impact."

epics:
  - id: EPIC-0
    name: Platform Stability & Guardrails
    objective: "Stabilize module scaffolding, CI reliability, and event→audit→notification basics."
    priority: P0
    stories:
      - id: S0.1
        title: "Standard module skeleton + route mounting law"
        priority: P0
        status: done
        updated_at: 2026-03-29
        acceptance_criteria:
          - "New module follows src/<Module>/{Controllers,Services,Models,routes/api.php}."
          - "Routes mounted in routes/api.php; no auto-load via provider."
          - "Routes are in correct middleware stack."
          - "composer ssot:lint passes with no NEW violations."
        evidence:
          routes: "Compatibility mount kept at /api/v1/work-template* via explicit require in routes/api.php; php artisan route:list --path=api/v1/work-template"
          tests: "php -d pcov.enabled=0 ./vendor/bin/phpunit --filter=Route (70 passed); php -d pcov.enabled=0 ./vendor/bin/phpunit --filter=Architecture (21 passed); tests/Unit/WorkTemplateRouteMountingLawTest.php; tests/Feature/Architecture/WorkTemplateRouteInvariantTest.php"
          lint: "composer ssot:lint; php artisan optimize:clear"
        notes:
          - "The Notification compatibility module is the first proved slice for this story: `routes/api.php` explicitly mounts `src/Notification/routes/api.php`, and `src/Notification/Providers/NotificationServiceProvider.php` no longer auto-mounts routes."
          - "The final active provider-based route-mount offender in the narrowed runtime inventory was `src/WorkTemplate/Providers/WorkTemplateServiceProvider.php`; this slice moved `src/WorkTemplate/routes/api.php` composition into `routes/api.php` and removed provider-side route mounting while preserving the compatibility `/api/v1/work-template*` runtime surface."
          - "Provider scan for the mounted module inventory now shows disabled or commented route auto-mounts elsewhere and no remaining active `Route::middleware(['api'])->prefix('api')->group(...)` offender under `src/*/Providers`."
      - id: S0.2
        title: "CI reliability hardening (Dusk/Docker/SSOT)"
        priority: P0
        status: todo
        acceptance_criteria:
          - "Dusk runs deterministically in CI (chromedriver path stable; no chmod symlink failures)."
          - "Docker scan builds image and scans local image (no unauthorized remote pulls)."
          - "SSOT lint runs in CI with valid env bootstrap."
          - "No 'push misfire' failures polluting PR checks."
      - id: S0.3
        title: "Event → Audit → Notification minimal pipeline"
        priority: P1
        status: done
        updated_at: 2026-07-07
        acceptance_criteria:
          - "Create Task/CR/Doc emits event, writes audit entry, triggers notification rule."
          - "At least one channel (in-app or email) works end-to-end."
          - "Has verify steps/tests for one event path."
        evidence:
          routes: "POST /api/zena/tasks (TaskController::store)"
          tests: "php artisan test tests/Feature/Api/TaskCreatedPipelineTest.php (5 passed)"
        notes:
          - "Pipeline wired in TaskController::emitTaskCreatedPipeline(): ZenaAuditLogger writes to audit_logs (action=zena.task.created), Notification created for assignee via CHANNEL_INAPP (type=task_assigned, event_key=zena.task.created), EventRecord written to event_records outbox."
          - "Notification only created when assignee_id is present; unassigned task creation writes audit + event record only."
          - "Pipeline runs synchronously post-commit; errors are caught and logged without failing the HTTP response."
          - "Proven event path: POST /api/zena/tasks → audit_log + event_record + inapp notification (5 tests, all canonical /api/zena/* paths)."

