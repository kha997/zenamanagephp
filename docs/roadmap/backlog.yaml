        notes:
          - "Canonical runtime now proves a dedicated nested timeline endpoint on /api/zena/change-requests/{id}/timeline backed by audit-log workflow history."
          - "Canonical runtime now proves CR-linked attachment discovery through /api/zena/documents with linked_entity_type=cr and linked_entity_id={changeRequestId}, keeping ownership in Document Center and avoiding duplicate CR-specific file APIs."
          - "Evidence comes only from canonical /api/zena/* routes and tests; no /api/v1/* path is used as proof."
