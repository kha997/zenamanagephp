          - "Canonical approver-discovery contract: change_requests.assigned_to = single-approver shorthand (submit recipient); change_request_approvals table = multi-approver owner surface for future expansion."
          - "Broader fan-out proved: approve() now notifies requested_by (requester, type=change_request_approved) AND projects.pm_id (type=change_request_approved_pm) when PM differs from requester. Both via CHANNEL_INAPP on the canonical /api/zena/change-requests path."
