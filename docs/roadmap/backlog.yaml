      - id: S3.2a
        title: "Broader approver/stakeholder notification semantics for canonical change requests"
        priority: P1
        status: done
        updated_at: 2026-07-07
        acceptance_criteria:
          - "Canonical approver-discovery and stakeholder recipient semantics are explicitly defined for /api/zena/change-requests using evidence-backed owner fields or routes."
          - "Any broader notification fan-out beyond the minimal direct-recipient slice is proved end-to-end on the canonical path without touching /api/v1/*."
