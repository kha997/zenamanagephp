name: Fixture — bad, phpunit.mysql.xml with an empty/non-mysql ZENA_INVARIANTS_DB value
on: push
jobs:
  bad-job:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
    steps:
      - name: Sets ZENA_INVARIANTS_DB but not to the literal "mysql"
        env:
          ZENA_INVARIANTS_DB: ''
          DB_CONNECTION: mysql
        run: |
          php artisan migrate:fresh --force
          ./vendor/bin/phpunit --configuration phpunit.mysql.xml tests/Feature/SomeTest.php
