name: Fixture — bad, phpunit.mysql.xml without ZENA_INVARIANTS_DB
on: push
jobs:
  bad-job:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
    steps:
      - name: Runs phpunit.mysql.xml but never sets ZENA_INVARIANTS_DB
        env:
          DB_CONNECTION: mysql
        run: |
          php artisan migrate:fresh --force
          ./vendor/bin/phpunit --configuration phpunit.mysql.xml tests/Feature/SomeTest.php
